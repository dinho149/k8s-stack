# gitleaks configuration: default rules plus an allowlist for the fixed assertion test vector.
# The value below is the documented HMAC test key shared by the Go and TypeScript assertion tests
# (services/teleport-access/internal/assertion/crosscheck_test.go, services/access-agent/test/*.test.ts).
# It is not a credential; every real key is generated by Pulumi and never committed.
[extend]
useDefault = true

[allowlist]
description = "fixed cross-language assertion test vector"
regexes = ['''0123456789abcdef0123456789abcdef''']
