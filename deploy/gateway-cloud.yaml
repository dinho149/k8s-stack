apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata: {name: stack}
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: {name: platform, namespace: envoy-gateway-system}
spec:
  gatewayClassName: stack
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs: [{name: platform-wildcard}]
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels: {stack.platform/routing: 'true'}
