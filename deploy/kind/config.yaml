kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
networking:
  disableDefaultCNI: true
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 18080
        listenAddress: 127.0.0.1
      - containerPort: 30443
        hostPort: 18443
        listenAddress: 127.0.0.1
      # Teleport proxy (multiplexed web UI, SSH, Kubernetes, database and app traffic on one port).
      # NodePort of the teleport-proxy-nodeport Service (infra/teleport); 30080 belongs to the gateway above.
      - containerPort: 30380
        hostPort: 3080
        listenAddress: 127.0.0.1
