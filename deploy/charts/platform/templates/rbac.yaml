# This controller belongs on a dedicated preview host, never on a production workload cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: dogfood-preview-controller}
rules:
  - apiGroups: ['']
    resources: [namespaces, services, endpoints, pods, pods/log, pods/portforward, secrets, configmaps, serviceaccounts, persistentvolumeclaims, resourcequotas, limitranges, events]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, replicasets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings, clusterroles, clusterrolebindings]
    verbs: [get, list, watch, create, update, patch, delete, bind, escalate]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: [cilium.io]
    resources: [ciliumnetworkpolicies]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: [kyverno.io]
    resources: [clusterpolicies]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: dogfood-preview-controller}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: dogfood-preview-controller}
subjects:
  - kind: ServiceAccount
    name: dogfood-lifecycle
    namespace: {{ .Release.Namespace }}
