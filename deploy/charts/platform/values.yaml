lifecycle:
  image: ghcr.io/replace-me/dogfood-lifecycle:0.1.0
  storage: 2Gi
  config: {}
agent:
  enabled: true
  image: ghcr.io/replace-me/dogfood-agent:0.1.0
  provider: bedrock
  storage: 5Gi
  serviceAccountAnnotations: {}
  bedrock: {region: '', model: ''}
  vertex: {region: '', project: '', model: ''}
  concurrency: 4
secretName: dogfood-secrets
portal:
  enabled: false
  frontendImage: ghcr.io/replace-me/dogfood-portal:0.1.0
  backendImage: ghcr.io/replace-me/dogfood-backstage:0.1.0
  hostname: portal.example.invalid
  config: {}

monitoring:
  enabled: false
  release: monitoring
  tokenSecret: dogfood-secrets
  tokenKey: DOGFOOD_METRICS_TOKEN
