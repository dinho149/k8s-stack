app:
  title: Dogfood
  baseUrl: http://localhost:3000
organization:
  name: Local platform
backend:
  baseUrl: http://localhost:7007
  listen: {host: 127.0.0.1, port: 7007}
  cors:
    origin: http://localhost:3000
    methods: [GET, POST, PUT, DELETE]
    credentials: true
  database:
    client: pg
    connection: ${BACKSTAGE_DATABASE_URL}
auth:
  environment: development
  providers:
    guest: {}
platform:
  apiUrl: http://127.0.0.1:8088
  agentUrl: http://127.0.0.1:8090
  serviceToken: ${DOGFOOD_SERVICE_TOKEN}
  identities:
    - entityRef: user:development/guest
      subject: local-developer
# Teleport access pages (make teleport-portal-forward writes .dogfood/teleport-portal.env with the URL + token).
# The guest account maps to TELEPORT_LOCAL_SUBJECT (default local-developer -> alice in the cluster's identity
# map); TELEPORT_LOCAL_SUBJECT=bob make restart switches the demo identity to the approver.
teleport:
  portalUrl: ${TELEPORT_PORTAL_URL}
  serviceToken: ${TELEPORT_SERVICE_TOKEN}
  identities:
    - entityRef: user:development/guest
      subject: ${TELEPORT_LOCAL_SUBJECT}
catalog:
  rules:
    - allow: [Component, System, API, Resource, Location, Template, User, Group]
  locations:
    - type: file
      target: ../../catalog/entities.yaml
