name: teleport-release-images

on:
  push:
    # Teleport service images are released on their own tag series (Dogfood images have their own workflow).
    tags: ["teleport-v*"]

permissions:
  contents: read

concurrency:
  group: teleport-release-images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # cosign keyless (Sigstore OIDC)
    strategy:
      fail-fast: false
      matrix:
        include:
          # teleport-access is built from the repository root (the Go code lives in the root module).
          - { name: teleport-access, context: ., file: deploy/teleport/images/teleport-access/Dockerfile }
          - { name: access-agent, context: services/access-agent, file: services/access-agent/Dockerfile }
          - { name: ssh-node, context: deploy/teleport/images/ssh-node, file: deploy/teleport/images/ssh-node/Dockerfile }
    outputs:
      digests: ${{ steps.digest.outputs.line }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build + push ${{ matrix.name }} (SBOM + max provenance, tag = release only, no :latest)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-contexts: lockfile=.
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ env.IMAGE_BASE }}/${{ matrix.name }}:${{ github.ref_name }}

      - name: Sign by digest (keyless)
        env:
          IMAGE: ${{ env.IMAGE_BASE }}/${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: SBOM of the pushed digest
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE_BASE }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.name }}.spdx.json
          artifact-name: sbom-${{ matrix.name }}.spdx.json
          upload-artifact: true
          upload-artifact-retention: 30

      - name: Attest the SBOM (keyless)
        env:
          IMAGE: ${{ env.IMAGE_BASE }}/${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign attest --yes --type spdxjson --predicate "sbom-${{ matrix.name }}.spdx.json" "${IMAGE}@${DIGEST}"

      - name: Re-scan the pushed digest (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_BASE }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "1"
          format: table

      - name: Record digest
        id: digest
        env:
          NAME: ${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          printf '      %s: %s\n' "$NAME" "$DIGEST" > "digests/$NAME.txt"
          echo "line=$NAME: $DIGEST" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.name }}
          path: digests/${{ matrix.name }}.txt
          retention-days: 30

  digests:
    # One YAML block in the exact shape the Pulumi stacks expect under teleport:images.
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: Job summary
        env:
          TAG: ${{ github.ref_name }}
          IMAGE_BASE: ${{ env.IMAGE_BASE }}
        run: |
          {
            echo "## Release images $TAG"
            echo
            echo "Signed (cosign keyless) and SBOM-attested. Verify with:"
            echo
            echo '```'
            echo "cosign verify --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/' --certificate-oidc-issuer https://token.actions.githubusercontent.com ${IMAGE_BASE}/<name>@<digest>"
            echo '```'
            echo
            echo "Pin in \`infra/teleport/Pulumi.<stack>.yaml\` under \`config: teleport:images\`:"
            echo
            echo '```yaml'
            echo "  images:"
            echo "    registry: ${IMAGE_BASE}"
            echo "    tag: ${TAG}"
            echo "    pullPolicy: IfNotPresent"
            echo "    digests:"
            cat digests/*.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat digests/*.txt
