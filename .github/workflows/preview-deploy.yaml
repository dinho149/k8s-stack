name: preview-deploy
on:
  workflow_run:
    workflows: [preview-build]
    types: [completed]
  pull_request_target:
    types: [closed]
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: preview-${{ github.event.pull_request.number || github.event.workflow_run.head_branch }}
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.event_name == 'pull_request_target' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: preview-control
    steps:
      # Always execute trusted base-branch code. Never check out the PR here.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/download-artifact@v4
        if: github.event_name == 'workflow_run'
        with:
          name: preview-input
          path: input
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Reconcile preview with current GitHub state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STACK_API_URL: ${{ vars.STACK_API_URL }}
          STACK_SERVICE_TOKEN: ${{ secrets.STACK_SERVICE_TOKEN }}
        run: python3 scripts/github-preview.py
