# kind cluster for the local Teleport stack.
#
# Only ONE host port is mapped: Teleport runs in multiplex mode, so web UI, SSH,
# Kubernetes, database and application traffic all flow through 3080.
# Host ports 80/443 are deliberately NOT used (another kind cluster on this
# machine owns them), and the cluster name is never the default "kind".
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: teleport-local
nodes:
  - role: control-plane
    image: kindest/node:v1.34.8@sha256:02722c2dedddcfc00febf5d27fbeb9b7b2c14294c82109ff4a85d89ac9ba3256
    extraPortMappings:
      - containerPort: 30080   # NodePort of the teleport-proxy-nodeport Service
        hostPort: 3080
        protocol: TCP
